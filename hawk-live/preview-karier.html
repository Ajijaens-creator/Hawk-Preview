/* HAWK × JAENS — Premium Black & Deep Gold Intelligence design system (prototype) */
:root {
  --black: #0b0b0b; --charcoal: #1a1a1a; --charcoal-2: #242424; --gold: #c99a2e; --gold-dark: #a67c1f; --bronze: #8b6914; --champagne: #e5c66a;

  --gold-grad: linear-gradient(135deg, #e5c66a 0%, #c99a2e 45%, #a67c1f 100%);

  --r: 14px; --r-sm: 9px; --sidebar: 252px; --topbar: 60px;
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: var(--ink); font-size: 14px;
}
* { box-sizing: border-box; }

a { color: var(--gold-dark); text-decoration: none; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; grid-template-rows: var(--topbar) 1fr; min-height: 100vh; }
.sidebar { grid-row: 1 / 3; background: var(--black); color: #d9d4c7; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden; z-index: 40; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card.pad0 { padding: 0; }

.grid { display: grid; gap: 14px; }

.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.kpi { position: relative; overflow: hidden; border-radius: var(--r); padding: 14px 16px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); min-width: 0; }
.kpi .lbl { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

.kpi.g-teal { background: linear-gradient(135deg, #12806f, #0b5a4e); }

/* tables */
.tbl-wrap { overflow-x: auto; border-radius: var(--r-sm); border: 1px solid var(--line); -webkit-overflow-scrolling: touch; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tab { border: 1px solid var(--line); background: #fff; padding: 7px 13px; border-radius: 99px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.tab.on { background: var(--gold-grad); border-color: transparent; color: #1b1505; }
.tab .c { margin-left: 4px; opacity: 0.7; }

/* forms */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 11.5px; font-weight: 700; color: var(--ink-2); letter-spacing: 0.02em; }

.radio-cards input:checked + span { font-weight: 700; color: var(--bronze); }

/* progress */
.bar { height: 8px; background: #efece4; border-radius: 99px; overflow: hidden; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--gold-grad); }
.bar.ok > i { background: var(--ok); } .bar.warn > i { background: #e0a526; } .bar.bad > i { background: var(--bad); }
.bar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: 0.5; }

.segbar > i { height: 100%; }

/* stepper */
.stepper { display: flex; align-items: center; gap: 0; margin: 4px 0 14px; overflow-x: auto; }
.step { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.step .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #ece8de; color: var(--ink-2); font-weight: 800; font-size: 12px; flex: none; }
.step.done .n { background: var(--gold-dark); color: #fff; }
.step.cur .n { background: var(--gold-grad); color: #111; box-shadow: 0 0 0 4px rgba(201, 154, 46, 0.2); }
.step.cur { color: var(--ink); font-weight: 700; }
.step-line { flex: 1; min-width: 18px; height: 2px; background: #e5e0d4; margin: 0 8px; }
.step-line.done { background: var(--gold-dark); }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { position: relative; padding: 0 0 12px 22px; font-size: 12.5px; }
.tl li::before { content: ''; position: absolute; left: 5px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); }
.tl li::after { content: ''; position: absolute; left: 9px; top: 15px; bottom: -2px; width: 1px; background: var(--line); }
.tl li:last-child::after { display: none; }
.tl .t { color: var(--muted); font-size: 11px; }

/* path cards (fulfillment) */
.paths { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.path { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; }

.path .big { font-size: 26px; font-weight: 800; margin: 6px 0 2px; }

.path.transfer { border-top: 4px solid var(--p-process); }
.path.purchase { border-top: 4px solid var(--p-promotion); }

/* drawers & modals */
.scrim { position: fixed; inset: 0; background: rgba(10, 10, 10, 0.45); z-index: 80; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--canvas); z-index: 90; transform: translateX(100%); transition: transform 0.25s ease; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }

.drawer-head h2 { font-size: 15px; }

.drawer-body { overflow-y: auto; padding: 16px; flex: 1; }
.drawer-foot { padding: 12px 16px; border-top: 1px solid var(--line); background: #fff; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -46%) scale(0.98); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow: auto; background: #fff; border-radius: 16px; z-index: 100; opacity: 0; pointer-events: none; transition: all 0.18s; box-shadow: var(--shadow-lg); }
.modal.on { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
.modal-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal-head h2 { font-size: 16px; }
.modal-body { padding: 16px 18px; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

/* toast */
.toasts { position: fixed; bottom: 18px; right: 18px; z-index: 120; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 36px)); }
.toast { background: var(--charcoal); color: #fff; border-left: 4px solid var(--gold); padding: 11px 14px; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 13px; animation: tin 0.2s ease; }
.toast.bad { border-left-color: var(--bad); }
.toast.ok { border-left-color: var(--ok); }
.toast small { display: block; color: #bbb; font-size: 11px; margin-top: 2px; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }

/* popover menus */
.pop { position: fixed; z-index: 95; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); min-width: 280px; max-width: calc(100vw - 20px); max-height: 75vh; overflow: auto; display: none; }
.pop.on { display: block; }
.pop-head { padding: 10px 14px; font-weight: 700; border-bottom: 1px solid var(--line); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.pop-item { display: flex; gap: 10px; align-items: center; padding: 9px 14px; cursor: pointer; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.pop-item:hover { background: #fbf8ef; }
.pop-item.cur { background: #fbf2d9; }
.pop-item .av { width: 30px; height: 30px; border-radius: 9px; background: #222; color: var(--champagne); display: grid; place-items: center; font-weight: 800; font-size: 11px; flex: none; }

/* AI */
.ai-card { border: 1px solid #e2d7ff; border-radius: 12px; padding: 12px 14px; background: #fff; cursor: pointer; }
.ai-card:hover { border-color: var(--violet); }
.ai-card .t { font-weight: 700; font-size: 13px; }
.ai-tag { display: inline-flex; gap: 5px; align-items: center; font-size: 10.5px; font-weight: 800; color: #5b34c9; background: #f1ebff; border-radius: 6px; padding: 2px 7px; letter-spacing: 0.04em; }
.stmt { display: grid; grid-template-columns: 170px 1fr; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 12.5px; align-items: start; }
.kind { font-size: 10.5px; font-weight: 800; padding: 3px 7px; border-radius: 6px; text-align: center; }
.k-fact { background: var(--ok-bg); color: var(--ok); }
.k-metric { background: var(--info-bg); color: var(--info); }
.k-forecast { background: var(--warn-bg); color: var(--warn); }
.k-hypo { background: #f1ebff; color: #5b34c9; }
.k-rec { background: #fbf2d9; color: var(--bronze); }
.sev { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.sev.HIGH { background: var(--bad); } .sev.MEDIUM { background: #e0a526; } .sev.LOW { background: var(--ok); }

/* hero */
.hero { position: relative; border-radius: 18px; overflow: hidden; padding: 22px 24px; color: #fff; background: radial-gradient(120% 140% at 85% 0%, rgba(229, 198, 106, 0.55) 0%, rgba(201, 154, 46, 0.25) 30%, transparent 60%), linear-gradient(120deg, #0b0b0b 0%, #1a1a1a 55%, #3a2a08 100%); }
.hero h2 { font-size: 22px; }
.hero p { color: #e8dfc6; margin: 6px 0 0; font-size: 13px; }
.hero .scene { position: absolute; right: 0; bottom: 0; height: 100%; opacity: 0.55; pointer-events: none; }

/* chart helpers */
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* 7P tiles */
.p7 { border-radius: 12px; padding: 12px; border: 1px solid var(--line); background: #fff; position: relative; overflow: hidden; }
.p7::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pc); }
.p7 .nm { font-weight: 700; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.p7 .v { font-weight: 800; font-size: 17px; margin: 4px 0; }

/* org tree */
.tree ul { list-style: none; margin: 0; padding-left: 18px; border-left: 1px dashed #ddd5c2; }
.tree > ul { padding-left: 0; border: 0; }
.tree li { margin: 4px 0; }
.tree .node { display: inline-flex; gap: 8px; align-items: center; padding: 5px 10px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; cursor: pointer; }
.tree .node.out { background: #f6f4ef; color: var(--muted); border-style: dashed; }
.tree .node.arch { opacity: 0.5; text-decoration: line-through; }

/* heatmap */
.heat td { text-align: right; font-size: 11.5px; padding: 6px 8px; }

/* dev contract panel */
.devbox { margin-top: 22px; border: 1px solid #2a2a2a; background: #121212; color: #ddd; border-radius: 14px; overflow: hidden; }
.devbox summary { cursor: pointer; padding: 12px 16px; font-weight: 700; color: var(--champagne); display: flex; gap: 10px; align-items: center; list-style: none; }
.devbox summary::-webkit-details-marker { display: none; }
.devbox .dv { padding: 4px 16px 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; font-size: 12px; }
.devbox h4 { color: var(--gold); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin: 8px 0 6px; }
.devbox dl { margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; }
.devbox dt { color: #888; }
.devbox dd { margin: 0; color: #e8e8e8; overflow-wrap: anywhere; }
.devbox table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.devbox td, .devbox th { border-top: 1px solid #262626; padding: 6px; text-align: left; vertical-align: top; }
.devbox th { color: #999; font-weight: 600; }

/* tour */
.tour { position: fixed; left: calc(var(--sidebar) + 16px); bottom: 16px; z-index: 70; background: var(--charcoal); color: #fff; border: 1px solid #3a3220; border-radius: 14px; box-shadow: var(--shadow-lg); width: min(430px, calc(100vw - 32px)); display: none; }
.tour.on { display: block; }
.tour-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #2c2c2c; font-weight: 700; font-size: 13px; }
.tour-body { padding: 12px 14px; font-size: 13px; }
.tour-body .stepno { color: var(--champagne); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
.tour-body p { margin: 6px 0 10px; color: #ddd; }
.tour-prog { display: flex; gap: 3px; margin-top: 10px; }
.tour-prog i { flex: 1; height: 4px; border-radius: 4px; background: #333; }
.tour-prog i.d { background: var(--gold); }
.tour-collapsed { position: fixed; left: calc(var(--sidebar) + 16px); bottom: 16px; z-index: 70; display: none; }
.tour-collapsed.on { display: inline-flex; }

/* scan */
.scanbox { border: 2px dashed var(--gold); border-radius: 16px; aspect-ratio: 4 / 3; max-height: 240px; display: grid; place-items: center; background: repeating-linear-gradient(45deg, #faf6ea, #faf6ea 10px, #fff 10px, #fff 20px); position: relative; overflow: hidden; }
.scanbox .laser { position: absolute; left: 8%; right: 8%; height: 2px; background: var(--bad); box-shadow: 0 0 8px var(--bad); animation: scan 1.6s ease-in-out infinite alternate; }
@keyframes scan { from { top: 18%; } to { top: 82%; } }

.itemcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; display: flex; flex-direction: column; gap: 6px; }
.itemcard .thumb { height: 64px; border-radius: 10px; display: grid; place-items: center; font-size: 26px; background: #f7f3e7; }
.itemcard .nm { font-weight: 700; font-size: 13px; line-height: 1.3; }

.alert { border-radius: 12px; padding: 10px 12px; font-size: 12.5px; display: flex; gap: 10px; align-items: flex-start; }
.alert.ok { background: var(--ok-bg); color: #145c33; }
.alert.warn { background: var(--warn-bg); color: #7a4f0e; }
.alert.bad { background: var(--bad-bg); color: #8f1f1f; }
.alert.info { background: var(--info-bg); color: #1d3f86; }
.alert.violet { background: var(--violet-bg); color: #4a2aa8; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .g5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .devbox .dv { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; transform: translateX(-100%); transition: transform 0.25s; }
  .sidebar.on { transform: none; box-shadow: var(--shadow-lg); }
  .topbar .burger { display: grid; }
  .g3, .g-2-1, .g-1-2 { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }
  .tour, .tour-collapsed { left: 16px; }
  .tb-select.org { max-width: 150px; }
}
@media (max-width: 720px) {
  .main { padding: 12px 12px 90px; }
  .topbar { padding: 0 10px; gap: 6px; }
  .tb-search { display: none; }
  .tb-select { max-width: 120px; font-size: 12px; padding: 6px 8px; }
  .tb-select.org { display: none; }
  .role-chip b, .role-chip small { display: none; }
  .role-chip { padding: 4px; }
  .g2, .g4, .g5, .paths { grid-template-columns: 1fr; }
  .g4.keep2, .g5.keep2 { grid-template-columns: 1fr 1fr; }
  .page-head h1 { font-size: 18px; }
  .page-head .actions { margin-left: 0; width: 100%; }
  .kv { grid-template-columns: 110px 1fr; }
  .stmt { grid-template-columns: 1fr; gap: 4px; }
  .devbox .dv { grid-template-columns: 1fr; }
  .kpi .val { font-size: 18px; }
  .btn { min-height: 44px; }
  .btn.sm { min-height: 34px; }
  .toasts { left: 12px; right: 12px; bottom: 12px; }
}
@media print { .sidebar, .topbar, .tour, .tour-collapsed, .devbox, .demo-banner { display: none !important; } .app { display: block; } }

/* AI insight chain: Finding → Evidence → Impact → Recommendation → Responsible role → Human decision (MP-HAWK-03) */
.ichain { list-style: none; margin: 12px 0 0; padding: 0; counter-reset: none; }
.ichain > li { position: relative; padding: 0 0 12px 18px; border-left: 2px solid var(--line); margin-left: 6px; }
.ichain > li:last-child { padding-bottom: 0; border-left-color: transparent; }
.ichain > li::before { content: ''; position: absolute; left: -7px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--gold); }
.ichain .ic-h { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 4px; }

/* Loading / error states */
.skel { background: linear-gradient(90deg, #f1efe9 25%, #faf8f3 37%, #f1efe9 63%); background-size: 400% 100%; animation: skel 1.2s ease infinite; border-color: transparent; }
@keyframes skel { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.state-err { border-left: 4px solid var(--bad, #c0392b); }

/* ===================== Smart Spend Money — Mobile Intelligence Edition (MP-HAWK-05/06) ===================== */
:root { --champ: #f4e7c0; --gold-prem: linear-gradient(135deg, #8b6914 0%, #c99a2e 52%, #f4d77b 100%); --ss-bg: #0e0d0b; --ss-card: #191816; --ss-line: #2c2a25; --ss-ink: #f3efe4; --ss-mute: #a39c8c; }
.ic.flip { transform: rotate(180deg); }
.ss-wrap { display: grid; grid-template-columns: minmax(0, 430px) minmax(0, 1fr); gap: 20px; align-items: start; }
.ss-side { min-width: 0; }
.ss-side details summary { cursor: pointer; }
.ss-phone { background: #050505; border-radius: 38px; padding: 10px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35), 0 0 0 1px #2b2b2b inset; position: sticky; top: 76px; }
.ss-screen { background: radial-gradient(120% 60% at 100% 0%, rgba(201, 154, 46, 0.16), transparent 60%), var(--ss-bg); color: var(--ss-ink); border-radius: 30px; min-height: 700px; display: flex; flex-direction: column; overflow: hidden; position: relative; animation: ssIn 0.22s ease-out; }
@keyframes ssIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.ss-top { display: flex; align-items: center; gap: 10px; padding: 14px 14px 8px; min-height: 58px; }
.ss-top > b { flex: 1; font-size: 16px; text-align: center; }
.ss-top-r { display: flex; justify-content: flex-end; min-width: 44px; }
.ss-logo { width: 32px; height: 32px; border-radius: 9px; background: var(--gold-prem); color: #111; display: grid; place-items: center; font-weight: 900; }
.ss-sim { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; letter-spacing: 0.04em; color: #1b1505; background: var(--gold-prem); padding: 4px 8px; border-radius: 99px; white-space: nowrap; }
.ss-ib { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--ss-line); background: var(--ss-card); color: var(--ss-ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.ss-ib.sm { width: 36px; height: 36px; }
.ss-body { padding: 6px 14px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.ss-hello h2 { font-size: 21px; color: #fff; }
.ss-hello p { margin: 4px 0 0; color: var(--ss-mute); font-size: 12.5px; }
.glass { background: rgba(38, 34, 26, 0.88); border: 1px solid rgba(244, 231, 192, 0.14); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3); }
@supports ((backdrop-filter: blur(16px)) or (-webkit-backdrop-filter: blur(16px))) { .glass { background: rgba(40, 35, 25, 0.55); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); } }
.ss-hero { border-radius: 20px; padding: 16px; display: flex; gap: 12px; align-items: center; background-image: linear-gradient(135deg, rgba(139, 105, 20, 0.55), rgba(201, 154, 46, 0.25) 60%, rgba(0, 0, 0, 0)); }
.ss-hero b { color: var(--champ); font-size: 17px; }
.ss-hero p { margin: 4px 0 0; color: #d9d1bb; font-size: 12.5px; line-height: 1.45; }
.ss-hero-ic { font-size: 40px; margin-left: auto; }
.ss-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ss-tile { position: relative; min-height: 112px; border-radius: 20px; border: 1px solid var(--ss-line); background: var(--ss-card); color: var(--ss-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px; cursor: pointer; transition: transform 0.12s, border-color 0.12s; }
.ss-tile:hover { border-color: #5a4a22; }
.ss-tile:active { transform: scale(0.97); }
.ss-tile b { font-size: 14px; }
.ss-tile small { color: var(--ss-mute); font-size: 11px; text-align: center; }
.ss-tile.gold { background: var(--gold-prem); color: #17120a; border: 0; box-shadow: 0 10px 26px rgba(201, 154, 46, 0.35); }
.ss-tile.gold small { color: #3d2f0b; }
.ss-tile.wide { grid-column: 1 / -1; min-height: 76px; flex-direction: row; }
.ss-tile-ic { color: inherit; }
.ss-tile:not(.gold) .ss-tile-ic { color: var(--gold); }
.ss-badge, .ss-dot { position: absolute; top: 8px; right: 10px; min-width: 20px; height: 20px; border-radius: 99px; background: var(--gold-prem); color: #111; font-size: 11px; font-weight: 800; display: grid; place-items: center; font-style: normal; padding: 0 5px; }
.ss-h4 { margin: 6px 0 0; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ss-mute); }
.ss-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border-radius: 14px; border: 1px solid var(--ss-line); background: var(--ss-card); color: var(--ss-ink); cursor: pointer; text-align: left; min-height: 56px; }
.ss-row-ic { font-size: 22px; }
.ss-row-m { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ss-row-m b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.ss-row-m small, .ss-row-r small { color: var(--ss-mute); font-size: 11px; }
.ss-row-r { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 12.5px; }
.ss-nav { display: flex; justify-content: space-around; align-items: flex-end; padding: 8px 6px 12px; border-top: 1px solid var(--ss-line); background: rgba(10, 10, 9, 0.96); position: sticky; bottom: 0; }
.ss-nav button { position: relative; background: none; border: 0; color: var(--ss-mute); display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; min-height: 48px; cursor: pointer; font-size: 10.5px; }
.ss-nav button.on { color: var(--gold); }
.ss-nav .ss-dot { top: -2px; right: 8px; }
.ss-fab { width: 58px; height: 58px; margin-top: -26px; border-radius: 50%; background: var(--gold-prem); color: #111; display: grid; place-items: center; box-shadow: 0 8px 22px rgba(201, 154, 46, 0.45); }
/* M2 capture */
.ss-screen.dark { background: #070707; }
.ss-cam { position: relative; height: 360px; border-radius: 22px; overflow: hidden; background: #191612; display: grid; place-items: center; }
.ss-cam img { max-width: 92%; max-height: 92%; transition: transform 0.25s; }
.ss-cam-empty { text-align: center; color: var(--ss-mute); font-size: 12.5px; }
.ss-cam-empty .ic { color: var(--gold); }
.ss-cam .cb { position: absolute; width: 34px; height: 34px; border: 4px solid var(--gold); }
.ss-cam .tl { top: 14px; left: 14px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
.ss-cam .tr { top: 14px; right: 14px; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
.ss-cam .bl { bottom: 14px; left: 14px; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
.ss-cam .br { bottom: 14px; right: 14px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
.ss-cam.crop::after { content: ''; position: absolute; inset: 40px 70px; border: 2px dashed rgba(244, 215, 123, 0.85); border-radius: 6px; pointer-events: none; }
.ss-edge { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); color: var(--champ); font-size: 11px; padding: 4px 10px; border-radius: 99px; }
.ss-scan { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5, 5, 5, 0.55); }
.ss-scanline { position: absolute; left: 8%; right: 8%; height: 3px; background: var(--gold-prem); box-shadow: 0 0 18px #f4d77b; top: 10%; animation: ssScan 1.4s ease-in-out infinite alternate; }
@keyframes ssScan { to { top: 88%; } }
.ss-scan-box { position: relative; background: rgba(15, 14, 12, 0.92); border: 1px solid #3a3222; border-radius: 16px; padding: 14px; width: 78%; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.ss-scan-box b { color: var(--champ); display: flex; gap: 6px; align-items: center; }
.ss-scan-step { color: var(--ss-mute); }
.ss-scan-step.done { color: #7bd88f; }
.ss-scan-step.cur { color: #fff; }
.ss-prog { height: 6px; border-radius: 99px; background: #2a261d; overflow: hidden; }
.ss-prog i { display: block; height: 100%; background: var(--gold-prem); transition: width 0.35s; }
.ss-tools { display: flex; gap: 8px; flex-wrap: wrap; }
.ss-pill { min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--ss-line); background: var(--ss-card); color: var(--ss-ink); display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; }
.ss-pill.on { background: var(--gold-prem); color: #17120a; border-color: transparent; font-weight: 700; }
.ss-shutter { display: flex; justify-content: space-around; align-items: center; padding: 4px 0; }
.ss-sbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ss-ink); background: none; border: 0; cursor: pointer; min-width: 64px; min-height: 52px; justify-content: center; font-size: 11px; }
.ss-shoot { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--gold); display: grid; place-items: center; cursor: pointer; }
.ss-shoot span { width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8e1, #f4d77b 55%, #c99a2e); }
.ss-shoot:active span { transform: scale(0.92); }
.ss-samples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ss-sample { border: 1px solid var(--ss-line); background: var(--ss-card); color: var(--ss-ink); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; min-height: 88px; text-align: center; }
.ss-sample span { font-size: 22px; }
.ss-sample b { font-size: 11px; line-height: 1.25; }
.ss-sample small { font-size: 10px; color: var(--ss-mute); }
.ss-sample.on { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201, 154, 46, 0.35); }
/* buttons */
.ss-cta { min-height: 52px; width: 100%; border: 0; border-radius: 16px; background: var(--gold-prem); color: #17120a; font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 8px 22px rgba(201, 154, 46, 0.3); transition: transform 0.1s, filter 0.1s; }
.ss-cta:active { transform: scale(0.98); filter: brightness(1.08); }
.ss-cta:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
.ss-btn2 { min-height: 52px; width: 100%; border-radius: 16px; border: 1px solid #3a372f; background: #151412; color: var(--ss-ink); font-weight: 700; cursor: pointer; }
.ss-btn2.bad { color: #ff9b9b; border-color: #5a2a2a; }
.ss-actions { display: flex; gap: 10px; }
.ss-actions.col { flex-direction: column; }
.ss-link { background: none; border: 0; color: var(--gold); font-size: 12.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; }
.ss-fine { color: var(--ss-mute); font-size: 11px; line-height: 1.45; margin: 0; }
.ss-p { margin: 0; font-size: 13px; color: #ded7c6; }
/* M3 review */
.ss-steps { display: flex; gap: 6px; }
.ss-steps span { flex: 1; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ss-mute); background: var(--ss-card); border: 1px solid var(--ss-line); border-radius: 12px; padding: 6px 8px; }
.ss-steps i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; background: #2a261d; display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; }
.ss-steps .cur { color: #fff; border-color: #6b5420; }
.ss-steps .cur i, .ss-steps .done i { background: var(--gold-prem); color: #111; }
.ss-ai { display: flex; gap: 12px; border-radius: 18px; padding: 12px; align-items: flex-start; }

<header class="hr-pub-top"><span class="brand-mark" aria-hidden="true">J</span><b>JAENS Karier</b><span class="badge demo">DATA DEMO / SIMULASI</span></header>
<main class="hr-pub-main">
  <div class="demo-banner"><b>PROTOTIPE.</b> Lowongan dan lamaran sintetis. Tidak ada data yang dikirim ke server; lamaran tersimpan di browser ini dan terbaca di portal HRD (pratinjau).</div>
  <p id="status" class="status" role="status"></p>
  <div id="view" tabindex="-1"></div>
</main>
<script>
const HAWK = (() => {
  const SEED = {
    budget: 25000000,
    requests: [{id:'MRF-001',campaign:'CMP-001',line:'BGL-UBD-2608-01',pos:'Promotion',amount:3500000,status:'posted',note:'Boost Reels teaser',history:[{status:'submitted',at:'2026-08-03'},{status:'approved',at:'2026-08-04'},{status:'posted',at:'2026-08-05',ref:'PST-2608-0001'}]}],
    leads: [{id:'LEAD-001',name:'Tamu Demo',source:'Instagram',channel:'WhatsApp',campaign:'CMP-001',status:'new'}],
    bookings: [{id:'BK-001',lead:'LEAD-HISTORY',source:'Organic',channel:'Website',campaign:'',partner:'',slot:'10.00',amount:750000,status:'paid',commissionRate:0,payout:false}],
    tasks: [{id:'TASK-01',team:'Commercial',person:'Rani',group:'Content',label:'Review materi Wellness Escape',status:'planned'},{id:'TASK-02',team:'Sales',person:'Dewa',group:'Reservasi',label:'Tindak lanjut lead WhatsApp',status:'planned'}],
    catalog:{name:'Wellness Massage',price:750000,duration:60},
    partner:{id:'DRV-001',name:'Driver Demo',rate:.1,active:false,agreement:false},
    b2b:{name:'Ubud Hotel Demo',stage:'Prospek'},
    slots:['11.00','13.00','15.00'],
    stock:12
  };
  const DEMO_TODAY = '2026-08-22';
  /* KOL tracking codes (demo). KOL-RAKA10 is expired to show the status. */
  const KOL_CODES = { 'KOL-ANYA10': { partner: 'KOL-001', validUntil: '2026-09-15' }, 'KOL-RAKA10': { partner: 'KOL-002', validUntil: '2026-08-15' } };
  const fresh = () => JSON.parse(JSON.stringify(SEED));
  const nextId = (prefix, rows) => prefix + '-' + String(rows.length + 1).padStart(3,'0');
  function totals(state){
    const actual = state.requests.filter(r=>r.status==='posted').reduce((sum,r)=>sum+r.amount,0);
    const committed = state.requests.filter(r=>r.status==='approved').reduce((sum,r)=>sum+r.amount,0);
    const paid = state.bookings.filter(b=>b.status==='paid');
    const revenue = paid.reduce((sum,b)=>sum+b.amount,0);
    const commission = paid.reduce((sum,b)=>sum+Math.round(b.amount*b.commissionRate),0);
    const attributed = paid.filter(b=>b.campaign==='CMP-001').reduce((sum,b)=>sum+b.amount,0);
    return {actual,committed,remaining:state.budget-actual-committed,revenue,commission,attributed,roas:actual?attributed/actual:null};
  }
  function requireState(condition,message){if(!condition)throw Error(message)}
  function update(state,action,input={}){
    const row = (rows) => rows.find(r=>r.id===input.id);
    switch(action){
      case 'request': {
        const amount=Number(input.amount);
        requireState(Number.isSafeInteger(amount)&&amount>0,'Masukkan nominal rupiah yang valid.');
        const id=nextId('MRF',state.requests);
        state.requests.push({id,campaign:input.campaign||'CMP-001',line:'BGL-UBD-2608-01',pos:input.pos||'Promotion',amount,status:'submitted',note:String(input.note||'').slice(0,120),history:[{status:'submitted',at:'2026-08-22'}]});
        break;
      }
      case 'approve': {
        const request=row(state.requests);
        requireState(request?.status==='submitted','Pengajuan sudah diproses.');
        requireState(request.amount<=totals(state).remaining,'Sisa pagu tidak mencukupi.');
        request.status='approved';
        (request.history=request.history||[]).push({status:'approved',at:'2026-08-22'});
        break;
      }
      case 'post': {
        const request=row(state.requests);
        requireState(request?.status==='approved','Setujui pengajuan sebelum realisasi.');
        request.status='posted';
        (request.history=request.history||[]).push({status:'posted',at:'2026-08-22',ref:'PST-2608-'+request.id.slice(4).padStart(4,'0')});
        break;
      }
      case 'reject': {
        const request=row(state.requests);
        requireState(request?.status==='submitted','Pengajuan sudah diproses.');
        const reason=String(input.reason||'').trim();
        requireState(reason.length>=5,'Tulis alasan penolakan (min. 5 karakter).');
        request.status='rejected'; request.reason=reason.slice(0,160);
        (request.history=request.history||[]).push({status:'rejected',at:'2026-08-22',reason:request.reason});
        break;
      }
      case 'lead': {
        requireState(['WhatsApp','Telepon','Website','Sosial media','Email'].includes(input.channel),'Kanal tidak valid.');
        state.leads.push({id:nextId('LEAD',state.leads),name:'Tamu Demo',source:input.channel==='WhatsApp'?'Instagram':'Tidak diketahui',channel:input.channel,campaign:input.channel==='WhatsApp'?'CMP-001':'',status:'new'});
        break;
      }
      case 'handoff': {
        const lead=row(state.leads);
        requireState(lead?.status==='new','Lead sudah ditindaklanjuti.');
        lead.status='staff';
        break;
      }
      case 'book': {
        const lead=row(state.leads);
        const partner=input.referral==='yes';
        /* KOL tracking code (F2-07): valid → booking carries KOL partner + CMP-004; expired/unknown are rejected with a status. */
        const code=String(input.code||'').trim().toUpperCase();
        const kol=code?KOL_CODES[code]:null;
        requireState(!code||kol,'Kode KOL tidak valid.');
        requireState(!kol||kol.validUntil>=DEMO_TODAY,'Kode KOL kedaluwarsa ('+(kol&&kol.validUntil)+').');
        requireState(!partner||state.partner.active,'Partner referral belum aktif.');
        requireState(state.slots.includes(input.slot)&&!state.bookings.some(b=>b.slot===input.slot&&b.status!=='cancelled'),'Slot sudah tidak tersedia.');
        requireState(!lead||lead.status!=='booked','Lead sudah memiliki booking.');
        state.bookings.push({id:nextId('BK',state.bookings),lead:lead?.id||'',source:lead?.source||(partner?'Referral':'Direct'),channel:lead?.channel||'Website',campaign:kol?'CMP-004':(lead?.campaign||''),kol:kol?kol.partner:'',kolCode:kol?code:'',partner:partner?state.partner.id:'',slot:input.slot,amount:state.catalog.price,status:'confirmed',commissionRate:partner?state.partner.rate:0,payout:false});
        if(lead)lead.status='booked';
        break;
      }
      case 'checkin': case 'complete': case 'pay': case 'cancel': case 'refund': {
        const booking=row(state.bookings);
        const transitions={checkin:['confirmed','checked-in'],complete:['checked-in','completed'],pay:['completed','paid'],cancel:['confirmed','cancelled'],refund:['paid','refunded']};
        const [from,to]=transitions[action];
        requireState(booking?.status===from,'Status booking sudah berubah.');
        requireState(action!=='refund'||!booking.payout,'Komisi sudah dibayar. Perlu penyesuaian Finance.');
        booking.status=to;
        if(action==='cancel'){
          const lead=state.leads.find(l=>l.id===booking.lead);
          if(lead)lead.status='staff';
        }
        break;
      }
      case 'agreement': state.partner.agreement=true; break;
      case 'activate':
        requireState(state.partner.agreement,'Perjanjian belum disetujui.');
        state.partner.active=true;
        break;
      case 'payout': {
        const booking=row(state.bookings);
        requireState(booking?.status==='paid'&&booking.commissionRate>0&&!booking.payout,'Komisi belum dapat dibayar.');
        booking.payout=true;
        break;
      }
      case 'pipeline': {
        const stages=['Prospek','Kualifikasi','Proposal','Negosiasi','Kontrak menang','Aktif','Booking pertama'];
        const index=stages.indexOf(state.b2b.stage);
        requireState(index<stages.length-1,'Pipeline telah mencapai tahap akhir.');
        state.b2b.stage=stages[index+1];
        break;
      }
      case 'task': {
        const task=row(state.tasks);
        requireState(task?.status==='planned','Tugas sudah selesai.');
        task.status='done';
        break;
      }
      default: throw Error('Aksi tidak tersedia.');
    }
  }
  return {fresh,totals,update,KOL_CODES,DEMO_TODAY};
})();
if (typeof module !== 'undefined') module.exports = HAWK;

;
/* HAWK ERP · Portal HRD & Human Growth · model F1 (Fondasi dan Beranda) — DATA DEMO / SIMULASI.
   Satu sumber untuk organisasi, 158 profil dummy, penempatan efektif, peran & cakupan, pengaturan,
   audit dan penghapusan dummy. Deterministik (tanpa Math.random). Tanpa jaringan, akun, atau API. */
const HR = (() => {
  const TODAY = '2026-11-13';
  const EXT = {}; /* kait fase berikutnya (F2: attStatus, update) */
  const SCHEMA = 4;

  /* ---------- organisasi (dinamis: semua layar membaca daftar ini, tidak ada cabang yang di-hardcode di UI) ---------- */
  const COMPANY = { id: 'CO-JAENS', name: 'JAENS Enterprises' };
  /* unit bisnis di bawah perusahaan (unit usaha tambahan menunggu keputusan F1) */
  const ENTITIES = [
    { id: 'ENT-SPA', name: 'JAENS Spa', kind: 'Unit bisnis spa · 4 outlet' },
    { id: 'ENT-HQ', name: 'Office / HQ', kind: 'Kantor pusat · divisi pendukung' }
  ];
  /* id outlet sama dengan SER (ser-data.js) supaya POS, jadwal dan KPI memakai outlet yang sama */
  const OUTLETS = [
    { id: 'OUT-UBD', entity: 'ENT-SPA', name: 'Spa Ubud', ser: 'Jaens Spa Center', code: 'UBD' },
    { id: 'OUT-SHT', entity: 'ENT-SPA', name: 'Spa Santi', ser: 'Jaens Spa Shanti', code: 'SHT' },
    { id: 'OUT-TRL', entity: 'ENT-SPA', name: 'Spa Triloka', ser: 'Jaens Spa Triloka', code: 'TRL' },
    { id: 'OUT-BSM', entity: 'ENT-SPA', name: 'Spa Bhisma', ser: 'Jaens Spa Bisma', code: 'BSM' }
  ];
  const HQ = { id: 'LOC-HQ', entity: 'ENT-HQ', name: 'Office Ubud', code: 'HQ' };

      <fieldset><legend>Data diri</legend><label>Nama lengkap<input name="name" required minlength="3" autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>WhatsApp<input name="phone" autocomplete="tel"></label><label>Dari mana Anda tahu lowongan ini?<select name="sourceAnswer"><option>Instagram JAENS</option><option>Website</option><option>Poster di outlet</option><option>Teman / karyawan JAENS</option><option>Lainnya</option></select></label><label class="wide">Motivasi bergabung<textarea name="motivation" rows="2"></textarea></label></fieldset>
      <fieldset><legend>Pengalaman & situasi kerja</legend>${f.q.map(field).join('')}</fieldset>
      <fieldset><legend>Kesiapan</legend><label>Kesiapan shift<select name="shiftReady"><option>Pagi/Sore</option><option>Pagi</option><option>Sore</option><option>Tidak</option></select></label><label>Domisili<input name="location" placeholder="mis. Ubud"></label><label>Ekspektasi gaji (Rp)<input name="salary" type="number" min="0" step="50000"></label><label>Siap mulai<input name="startReady" type="date"></label><label>Pilihan jadwal interview (WITA)<select name="ivPref">${ivSlots.map(s => `<option>${s}</option>`).join('')}</select></label></fieldset>
      <fieldset><legend>Lampiran (sintetis)</legend><label class="wide">Nama file, pisahkan koma<input name="docs" value="cv.pdf" required></label><p class="muted small">CV wajib. PDF/JPG/PNG maks 5 MB. Foto, KTP, ciri tulisan tangan dan asesmen kepribadian tidak dipakai dalam penilaian AI.</p><label class="check"><input type="checkbox" name="consent" value="1"> Saya setuju data diproses untuk rekrutmen JAENS.</label></fieldset>
      <div class="hr-review-box" hidden><h3>Tinjau sebelum kirim</h3><dl></dl></div>
      <div class="actions"><button type="button" class="btn ghost" data-career-review="1">Tinjau jawaban</button><button class="btn" data-career-send hidden>Kirim lamaran</button></div></form>`;
  }
  /* tinjau sebelum kirim: tombol kirim muncul setelah ringkasan ditampilkan */
  if (typeof document !== 'undefined') document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-career-review]'); if (!b) return;
    const form = b.closest('form'), box = form.querySelector('.hr-review-box'), dl = box.querySelector('dl');
    const skip = ['vac', 'ch', 'submitKey'];
    dl.innerHTML = [...new FormData(form)].filter(([k]) => !skip.includes(k)).map(([k, v]) => `<dt>${esc(form.querySelector(`[name="${k}"]`)?.closest('label')?.childNodes[0]?.textContent?.trim() || k)}</dt><dd>${esc(v || '—')}</dd>`).join('');
    box.hidden = false; form.querySelector('[data-career-send]').hidden = false; box.scrollIntoView?.({ block: 'nearest' });
  });
  return { landing, job, apply, esc, qs };
})();
if (typeof module !== 'undefined') module.exports = HRCAREER;

;
/* HAWK HRD · halaman karier publik (F4-NV01..NV03) — DATA DEMO / SIMULASI.
   Tanpa login internal. Menyimpan lamaran ke penyimpanan demo yang sama dengan portal HRD (browser ini). */
(() => {
  const KEY = 'hawk-integrated-demo-v1';
  let state = HAWK.fresh();
  try { const s = localStorage.getItem(KEY); if (s) state = JSON.parse(s); } catch (e) { /* in-memory */ }
  const hr = () => { const h = HR.ensure(state); HR.EXT.ensure?.(h); return h; };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* abaikan */ } };
  const parse = () => { const sp = new URLSearchParams(location.hash.replace(/^#/, '').replace('?', '&')); const p = Object.fromEntries(sp); if (p.job) return { r: 'job', p: { ...p, id: p.job } }; if (p.apply) return { r: 'apply', p: { ...p, id: p.apply } }; if ('done' in p && p.done) return { r: 'apply', p }; return { r: 'land', p }; };
  const R = { land: 'land', job: 'job', apply: 'apply', href: (r, p) => { const { id, ...rest } = p || {}; const q = HRCAREER.qs(rest); return r === 'land' ? `#${q}` : `#${r}=${encodeURIComponent(id || '')}${q}`; } };
  const view = document.getElementById('view'), status = document.getElementById('status');
  function render(msg, err) {
    const { r, p } = parse();
    status.textContent = msg || ''; status.className = 'status' + (err ? ' bad-text' : ''); status.setAttribute('role', err ? 'alert' : 'status');
    view.innerHTML = r === 'job' ? HRCAREER.job(hr(), p, R) : r === 'apply' ? HRCAREER.apply(hr(), p, R, { after: 'done' }) : HRCAREER.landing(hr(), p, R);
    document.title = 'Karier JAENS · ' + (r === 'job' ? 'Detail lowongan' : r === 'apply' ? 'Lamar' : 'Lowongan');
  }
  window.addEventListener('hashchange', () => render());
  document.addEventListener('change', (e) => { const f = e.target.closest('form[data-career-filter]'); if (!f) return; const p = Object.fromEntries([...new FormData(f)].filter(([, v]) => v)); const ch = parse().p.ch; location.hash = R.href('land', { ...p, ch }); });
  document.addEventListener('click', (e) => { if (e.target.closest('[data-action="filter-reset"]')) { location.hash = ''; render(); } });
  document.addEventListener('submit', (e) => {
    const f = e.target.closest('form[data-submit="hr:app-submit"]'); if (!f) return; e.preventDefault();
    try { const id = HR.update(state, 'app-submit', { by: 'Kandidat', role: 'public', ...Object.fromEntries(new FormData(f)) }); save(); location.hash = `done=${encodeURIComponent(id)}`; }
    catch (err) { render(err.message, true); }
  });
  render();
})();

</script>
