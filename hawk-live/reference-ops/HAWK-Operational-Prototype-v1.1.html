/* Local workflow simulation. Every action rechecks scope and state. */
(function(){
  'use strict';
  const H=window.H,e=H.escape;
  const deptNames={reception:'Reception',therapist:'Therapist',attendant:'Attendant',security:'Security'};
  const statusNames={todo:'Belum mulai',doing:'Dikerjakan',head_review:'Review Head',supervisor_review:'Review Supervisor',done:'Selesai'};
  const statusColors={todo:'gray',doing:'blue',head_review:'gold',supervisor_review:'gold',done:'green'};
  const manager=()=>['manager','assistant'].includes(H.user().role);
  const leader=()=>['manager','assistant','supervisor'].includes(H.user().role);
  const canAssign=()=>H.has('tasks')&&(leader()||H.user().role==='head');
  const now=()=>new Date().toISOString();
  const visibleTask=id=>H.has('tasks')?H.scopedTasks().find(t=>t.id===id):undefined;
  const explicitOutlet=()=>!manager()||H.state.outletId!=='all';
  const writeOutlet=o=>H.outlets.some(x=>x.id===o)&&(manager()?H.state.outletId==='all'||H.state.outletId===o:H.user().outlet===o);
  const selectWrittenOutlet=o=>{if(manager())H.state.outletId=o;};
  const timeLabel=s=>{if(!s)return '—';const d=new Date(s);return Number.isFinite(d.getTime())?d.toLocaleTimeString('id-ID',{timeZone:'Asia/Makassar',hour:'2-digit',minute:'2-digit'}):'—';};
  const safeId=prefix=>prefix+'-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1000);
  function stat(label,value,note){return `<div class="stat"><span class="stat-label">${e(label)}</span><strong class="stat-value">${e(value)}</strong><span class="stat-note">${e(note)}</span></div>`;}
  function inTaskScope(t){return !!t&&H.scopedTasks().some(x=>x.id===t.id);}
  H.canTask=(t,action='view')=>{
    if(!inTaskScope(t)||!H.has('tasks'))return false;
    if(action==='view')return true;
    if(!explicitOutlet())return false;
    const u=H.user(),own=t.assignee===u.id;
    const departmentReview=H.has('task.review')&&(leader()||u.role==='head'&&u.dept===t.dept);
    if(action==='start')return own&&t.status==='todo';
    if(action==='submit')return own&&t.status==='doing';
    if(action==='comment')return true;
    if(action==='head-approve')return t.status==='head_review'&&departmentReview&&!(t.critical&&own);
    if(action==='final-verify')return t.status==='supervisor_review'&&H.has('task.verify')&&!own;
    if(action==='return')return (t.status==='head_review'&&departmentReview||t.status==='supervisor_review'&&H.has('task.verify'))&&!(t.critical&&own);
    return false;
  };
  function reject(){H.toast('Aksi ditolak: periksa akun, outlet, penugasan dan tahap tugas.');}
  function commitTask(t,action,detail){t.updatedAt=now();H.log(action,t.id,detail);H.save();H.closeModal();H.render();H.toast(detail);}
  function taskCard(t){return `<article class="task-item"><div class="task-tags">${H.badge(t.critical?'Kritis':'Rutin',t.critical?'red':'gray')}${H.badge(deptNames[t.dept]||t.dept,'gray')}</div><h4>${e(t.title)}</h4><p>${e(t.id)} · ${e(H.outletName(t.outlet))}</p><div class="tc-task-meta"><span>${H.icon('clock',12)} ${e(t.due||'—')}</span><span>${H.icon('chat',12)} ${(t.comments||[]).length}</span></div><div class="tc-pic"><span class="tc-avatar">${e((H.accountName(t.assignee)||'P').slice(0,1))}</span><span>${e(H.accountName(t.assignee))}</span></div>${['head_review','supervisor_review'].includes(t.status)?`<div class="tc-review-badge">${H.badge(statusNames[t.status],'gold')}</div>`:''}<button class="btn btn-sm" data-act="task-open" data-id="${e(t.id)}">${H.canTask(t,'head-approve')||H.canTask(t,'final-verify')?'Tinjau hasil':'Buka tugas'} ${H.icon('arrow',13)}</button></article>`;}
  function taskFiltered(){const q=(H.ui.taskSearch||'').toLowerCase(),dept=H.ui.taskDept||'all';return H.scopedTasks().filter(t=>(dept==='all'||t.dept===dept)&&(!q||[t.title,t.id,t.assigneeName].join(' ').toLowerCase().includes(q)));}
  H.pages.tasks={
    title:'Team & Tasks',subtitle:'Satu PIC, bukti kerja yang jelas, Head review dan Supervisor assurance.',phase:'F-OP05',
    contract:'Task baru additive. Assignment merujuk HRD employee ID dan outlet. Transition guard, scope, evidence, versi kebijakan dan audit wajib ditegakkan server.',
    actions:()=>canAssign()?`<button class="btn btn-primary btn-sm" data-act="task-create">${H.icon('plus',14)} Buat tugas</button>`:'',
    render(){const all=H.scopedTasks(),tasks=taskFiltered(),view=H.ui.taskView||'board',depts=leader()?Object.keys(deptNames):[H.user().dept];
      return `<div class="grid-4">${stat('Dalam lingkup Anda',all.length,leader()?'Seluruh tim pada outlet terpilih':H.user().role==='head'?'Tim departemen Anda':'Penugasan pribadi')}${stat('Sedang dikerjakan',all.filter(t=>t.status==='doing').length,'Pekerjaan aktif')}${stat('Menunggu review',all.filter(t=>['head_review','supervisor_review'].includes(t.status)).length,'Head → Supervisor sesuai risiko')}${stat('Tuntas sesuai kebijakan',all.filter(t=>t.status==='done').length,all.filter(t=>t.status==='done'&&t.verifiedAt).length+' dengan verifikasi reviewer')}</div>
      <div class="tc-toolbar"><div class="filter-bar"><input aria-label="Cari tugas" placeholder="Cari task, judul, atau PIC…" value="${e(H.ui.taskSearch||'')}" data-change="task-search"><select aria-label="Filter departemen" data-change="task-dept"><option value="all">Semua dalam lingkup</option>${depts.filter(d=>deptNames[d]).map(d=>`<option value="${d}" ${H.ui.taskDept===d?'selected':''}>${deptNames[d]}</option>`).join('')}</select></div><div class="tabs" role="tablist"><button class="tab ${view==='board'?'active':''}" data-act="task-view" data-id="board">Board</button><button class="tab ${view==='list'?'active':''}" data-act="task-view" data-id="list">Daftar</button></div></div>

    if(index>run.stepIndex&&!s.steps.slice(0,index).every((_,i)=>evaluateStep(run,i).complete))return H.toast('Selesaikan hasil langkah sebelumnya terlebih dahulu.');

  function start(id,outlet) {
