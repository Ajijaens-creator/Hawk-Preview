<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAWK ERP · Commercial Executive Summary</title>
<style>
:root{--ink:#1b1b18;--canvas:#f5f4f0;--card:#fffefb;--line:#e3e0d7;--muted:#625d52;--gold:#a37430;--green:#246451}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px system-ui,sans-serif}a{color:#694713}a:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #a57528;outline-offset:3px}
.top{padding:12px clamp(14px,4vw,40px);display:flex;justify-content:space-between;align-items:center;background:#191919;color:white}.brand{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,#f3db9d,#ad7d36);color:#191919;font-size:20px;font-weight:800}.brand small{display:block;color:#efd9aa;font-size:9px;letter-spacing:.11em}.badge{background:#f5e8c8;color:#624719;padding:6px 10px;border-radius:24px;font-size:11px;font-weight:800}
main{max-width:1360px;margin:auto;padding:20px clamp(12px,3vw,36px) 36px}.notice{padding:9px 12px;border:1px dashed #b39a66;border-radius:8px;background:#fff9ec;color:#624719}.crumb{margin:15px 0 5px;color:var(--muted);font-size:12px}h1{font-size:clamp(25px,3vw,36px);line-height:1.1;margin:0}.heading{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}.heading p{margin:6px 0 0;color:var(--muted)}form{display:flex;gap:8px;flex-wrap:wrap;align-items:end}label{display:grid;gap:4px;font-size:12px;font-weight:650}select,button{font:inherit;color:inherit;background:var(--card);border:1px solid #c9bda2;border-radius:8px;padding:8px}button{cursor:pointer}
.hero{background:radial-gradient(ellipse at 92% 0%,#69552a,transparent 68%),#191919;color:#fff8e7;padding:15px 18px;border-radius:12px;margin-bottom:14px}.hero b{font-size:16px}.hero p{margin:4px 0 0;color:#eee0c5}
.row{display:grid;gap:12px;margin-bottom:12px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.mid{grid-template-columns:1.3fr 1fr .9fr}.bottom{grid-template-columns:repeat(3,minmax(0,1fr))}.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.card h2{font-size:15px;margin:0 0 8px}.kpi strong,.number{display:block;font-size:clamp(20px,2.45vw,32px);letter-spacing:-.04em}.kpi{border-top:3px solid #b79353}.kpi:nth-child(2){border-top-color:#397661}.kpi:nth-child(3){border-top-color:#65518e}.kpi:nth-child(4){border-top-color:#42659b}.muted,summary{color:var(--muted);font-size:12px}.up{color:#246451}.down{color:#99392f}.gauge{width:100px;display:block;margin:1px 0}.chart{display:block;width:100%;height:auto}.chart text{font:11px system-ui;fill:#625d52}.legend{font-size:12px;color:var(--muted);margin:5px 0}.metric{display:flex;justify-content:space-between;gap:8px;margin:8px 0 3px}.track{height:8px;background:#eee8db;border-radius:8px;overflow:hidden}.fill{display:block;height:100%;background:#a37430}.budget{display:flex;gap:12px;align-items:center}.ring{flex:none;width:82px;aspect-ratio:1;border-radius:100%;display:grid;place-items:center;background:conic-gradient(#397661 var(--value),#eee8db 0)}.ring b{display:grid;place-items:center;width:62px;aspect-ratio:1;border-radius:100%;background:var(--card)}dl{margin:0}dt{font-size:11px;color:var(--muted)}dd{margin:0 0 5px;font-weight:700}details{margin-top:9px}summary{cursor:pointer}.table{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th,td{padding:6px;border-bottom:1px solid var(--line)}.insight p{margin:5px 0}
@media(max-width:860px){.heading{align-items:start;flex-direction:column}.mid,.bottom{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.card{padding:10px}.row{gap:8px}.kpi strong{font-size:18px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="F1-01-portal-picker.html" aria-label="HAWK ERP, buka pemilih portal"><span class="mark" aria-hidden="true">H</span><span><b>HAWK ERP</b><small>JAENS ENTERPRISES</small></span></a><span class="badge">DATA DEMO</span></header>
<main>
<div class="notice"><b>PROTOTIPE · SIMULASI.</b> Angka sintetis untuk meninjau tata letak dan filter.</div>
<div class="crumb">HAWK ERP › Commercial › F1-02</div>
<header class="heading"><div><h1>Executive Performance Summary</h1><p>Commercial Performance Overview</p></div><form id="filters"><label>Periode <select id="period"><option value="8">Agustus 2026</option><option value="7">Juli 2026</option></select></label><label>Outlet <select id="outlet"><option value="all">Semua outlet</option><option value="ubud">Giant Spa Ubud</option><option value="shanti">Giant Spa Shanti</option></select></label><button type="reset">Reset</button></form></header>
<section class="hero"><b>Ringkasan Commercial Manager</b><p id="scope" role="status"></p></section>
<div id="dashboard"></div>
</main>
<script>
const outlets = {ubud:'Giant Spa Ubud',shanti:'Giant Spa Shanti'};
const history = {
  ubud:{current:[1080,1110,1240,1210,1300,1410,1520,1680],previous:[940,1020,1110,1140,1130,1260,1350,1440,1490,1450,1520,1610]},
  shanti:{current:[760,780,840,890,940,980,1070,1140],previous:[620,675,690,740,810,830,870,930,970,960,990,1050]}
};
// All monetary fixture amounts are in Rp million.
const monthly = {
  6:{ubud:[1650,1640,1710,105,51,280],shanti:[1190,1170,1270,80,40,180]},
  7:{ubud:[1760,1740,1800,115,56,310],shanti:[1260,1240,1290,82,45,195]},
  8:{ubud:[1920,1880,1850,120,63,352],shanti:[1340,1315,1340,90,48,207]}
};
const outlet = document.querySelector('#outlet');
const period = document.querySelector('#period');
const labels = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const num = (value,digits=0) => value.toLocaleString('id-ID',{maximumFractionDigits:digits});
const rp = (value,digits=0) => 'Rp '+num(value,digits)+' jt';
const sum = values => values.reduce((total,value)=>total+value,0);
function totals(month,keys){
  const [orders,customers,target,budget,spend,contribution] = monthly[month][keys[0]].map((_,i)=>sum(keys.map(k=>monthly[month][k][i])));
  const revenue = sum(keys.map(k=>history[k].current[month-1]));
  return {orders,customers,target,budget,spend,revenue,aov:revenue*1000000/orders,romi:(contribution-spend)/spend};
}
function delta(value,prior){
  const change=(value/prior-1)*100;
  return `<span class="${change<0?'down':'up'}">${change<0?'↓':'↑'} ${num(Math.abs(change),1)}% vs bulan lalu</span>`;
}
function bars(rows,maximum,format){
  return rows.map(([label,value])=>`<div class="metric"><span>${label}</span><b>${format(value)}</b></div><div class="track" aria-hidden="true"><span class="fill" style="width:${value/maximum*100}%"></span></div>`).join('');
}
function trend(keys,month){
  const series=kind=>labels.map((_,i)=>sum(keys.map(k=>history[k][kind][i]||0)));
  const last=series('previous'), current=series('current').slice(0,month);
  const max=Math.max(...last,...current);
  const x=i=>38+i*30;
  const y=v=>124-v/max*102;
  const points=values=>values.map((v,i)=>x(i)+','+y(v)).join(' ');
  return `<svg class="chart" viewBox="0 0 386 155" role="img" aria-label="Tren revenue bulanan 2025 dan 2026. Nilai tersedia di tabel.">
  ${[0,max/2,max].map(v=>`<path d="M38 ${y(v)}H368" stroke="#e3e0d7"/><text x="0" y="${y(v)+3}">${num(v)}</text>`).join('')}
  <polyline points="${points(last)}" fill="none" stroke="#625d52" stroke-width="2" stroke-dasharray="5 4"/>
  <polyline points="${points(current)}" fill="none" stroke="#a37430" stroke-width="3"/>
  ${labels.map((l,i)=>`<text x="${x(i)}" y="145" text-anchor="middle">${l}</text>`).join('')}</svg>
  <div class="legend">━━ 2026 hingga periode terpilih · ┄ 2025 · Rp juta</div>
  <details><summary>Lihat tabel revenue</summary><div class="table"><table><thead><tr><th>Bulan</th><th>2026</th><th>2025</th></tr></thead><tbody>${labels.map((label,i)=>`<tr><th scope="row">${label}</th><td>${i<month?rp(current[i]):'—'}</td><td>${rp(last[i])}</td></tr>`).join('')}</tbody></table></div></details>`;
}
function render(){
  const keys=outlet.value==='all'?Object.keys(outlets):[outlet.value];
  const month=Number(period.value);
  const data=totals(month,keys), prior=totals(month-1,keys);
  const target=data.revenue/data.target*100;
  const used=data.spend/data.budget*100;
  const cancelled=keys.map(k=>[outlets[k],k==='ubud'?{schedule:11+month,customer:8+month}:{schedule:7+month,customer:5+month}]);
  document.querySelector('#scope').textContent=labels[month-1]+' 2026 · '+(outlets[outlet.value]||'Semua outlet')+' · dibandingkan bulan sebelumnya';
  document.querySelector('#dashboard').innerHTML=`
    <div class="row kpis">
    <section class="card kpi"><h2>Total Revenue</h2><strong>${rp(data.revenue)}</strong><div class="muted">${delta(data.revenue,prior.revenue)}</div></section>
    <section class="card kpi"><h2>Total Customers</h2><strong>${num(data.customers)}</strong><div class="muted">${delta(data.customers,prior.customers)}</div></section>
    <section class="card kpi"><h2>Effective Target Rate</h2><svg class="gauge" viewBox="0 0 104 54" aria-hidden="true"><path d="M5 50 A47 47 0 0 1 99 50" fill="none" stroke="#eee8db" stroke-width="8"/><path d="M5 50 A47 47 0 0 1 99 50" pathLength="100" stroke-dasharray="${Math.min(target,100)} 100" fill="none" stroke="#397661" stroke-width="8"/></svg><strong>${num(target,1)}%</strong><small class="muted">Target ${rp(data.target)}</small></section>
    <section class="card kpi"><h2>Average Order Value</h2><strong>Rp ${num(data.aov)}</strong><div class="muted">${delta(data.aov,prior.aov)}</div></section>
    </div>
    <div class="row mid">
    <section class="card"><h2>Annual Revenue Comparison</h2>${trend(keys,month)}</section>
    <section class="card"><h2>Budget Realization</h2><div class="budget"><div class="ring" style="--value:${used}%"><b>${num(used,1)}%</b></div><dl><dt>Pagu</dt><dd>${rp(data.budget)}</dd><dt>Realisasi</dt><dd>${rp(data.spend)}</dd><dt>Sisa</dt><dd>${rp(data.budget-data.spend)}</dd></dl></div></section>
    <section class="card"><h2>Return on Marketing Investment</h2><strong class="number">${num(data.romi,2)}×</strong><div class="muted">${delta(data.romi,prior.romi)}</div><p class="muted">(Kontribusi teratribusi sebelum biaya marketing − biaya marketing) ÷ biaya marketing.</p></section>
    </div>
    <div class="row bottom">
    <section class="card"><h2>Tracking by Channel Group</h2><p class="muted">Pangsa revenue demo</p>${bars([['Paid',.36],['Organic & Direct',.41],['Partner & Referral',.23]].map(([label,share])=>[label,data.revenue*share]),data.revenue,value=>rp(value,1))}</section>
    <section class="card"><h2>Tracking by Country</h2><p class="muted">Pelanggan demo berdasarkan negara</p>${bars([['Indonesia',Math.floor(data.customers*.46)],['Australia',Math.floor(data.customers*.26)],['Lainnya',data.customers-Math.floor(data.customers*.46)-Math.floor(data.customers*.26)]],data.customers,num)}</section>
    <section class="card"><h2>Cancellation Reason by Branch</h2><div class="table"><table><thead><tr><th>Outlet</th><th>Jadwal</th><th>Tamu</th></tr></thead><tbody>${cancelled.map(([name,value])=>`<tr><th scope="row">${name}</th><td>${value.schedule}</td><td>${value.customer}</td></tr>`).join('')}</tbody></table></div></section>
    </div>
    <section class="card insight"><h2>Executive Insight <span class="badge">SIMULASI</span></h2><p>Revenue ${data.revenue>=prior.revenue?'naik':'turun'} ${num(Math.abs(data.revenue/prior.revenue-1)*100,1)}% dibanding bulan lalu. Pencapaian terhadap target ${num(target,1)}%.</p><p>Bandingkan perubahan volume order dan AOV, lalu tinjau pembatalan per outlet untuk memilih tindak lanjut.</p></section>`;
}
document.querySelector('#filters').addEventListener('change',render);
document.querySelector('#filters').addEventListener('reset',()=>requestAnimationFrame(render));
render();
</script>
</body>
</html>
